openapi: 3.0.3
info:
  title: AI 刷题 App API
  version: 0.1.0
  description: |
    首版接口契约（可靠刷题闭环 + 学习档案 + 管理端内容维护与题库导入）。
    - 前缀 /api/v1；JSON 字段 camelCase，枚举值小写 snake_case。
    - 时间为 UTC RFC 3339；列表使用游标分页 ?cursor=&limit=（默认 20，最大 100）。
    - 认证：HttpOnly Cookie（session）；写请求校验 Origin。
    - 错误统一结构：{"error": {"code", "message", "requestId"}}；前端分支只依赖稳定 code。
    - 核心边界：提交前接口永不返回答案、解析或判分字段；answer_keys 仅判分与管理端可读。
servers:
  - url: /api/v1
tags:
  - name: auth
  - name: learning
  - name: practice
  - name: admin

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: 邮箱注册（成功后设置会话 Cookie）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        '201': { description: 注册成功, content: { application/json: { schema: { $ref: '#/components/schemas/MeResponse' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/login:
    post:
      tags: [auth]
      summary: 登录并设置 Cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200': { $ref: '#/components/responses/MeResponse' }
        '401': { description: 凭证错误 invalid_credentials }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      tags: [auth]
      summary: 失效当前会话
      responses: { '200': { description: OK } }
  /auth/change-password:
    post:
      tags: [auth]
      summary: 修改当前账号密码
      description: 校验当前密码后更新密码哈希，并失效其他会话；当前会话继续有效。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '200': { description: 修改成功 }
        '400': { description: invalid_current_password / validation_failed }
  /auth/password-reset/request:
    post:
      tags: [auth]
      summary: 创建找回密码请求（dev 环境返回一次性 resetToken）
      responses: { '200': { description: OK } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string } }
  /auth/password-reset/confirm:
    post:
      tags: [auth]
      summary: 使用一次性令牌设置新密码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string }
      responses: { '200': { description: OK } }
  /me:
    get:
      tags: [auth]
      summary: 当前账号、角色与默认级别
      responses:
        '200': { $ref: '#/components/responses/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [auth]
      summary: 更新默认级别
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { defaultLevelId: { type: string, nullable: true } }
      responses:
        '200': { $ref: '#/components/responses/MeResponse' }
  /catalog:
    get:
      tags: [learning]
      summary: 考试、级别与科目树
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  exams:
                    type: array
                    items: { $ref: '#/components/schemas/Exam' }
  /dashboard:
    get:
      tags: [learning]
      summary: 仪表盘（进行中批次、最近练习、可解释推荐）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
  /learning-memory:
    get:
      tags: [learning]
      summary: 当前账号的全局做题记忆与 AI 建议
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningMemory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [learning]
      summary: 删除当前账号的派生做题记忆
      description: 清除统计和 AI 建议并从现在重新累计；原始练习历史与成绩保留。
      responses:
        '204': { description: 已删除 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /knowledge-points:
    get:
      tags: [learning]
      summary: 知识点列表（含个人统计；仅已发布）
      parameters:
        - { name: levelId, in: query, schema: { type: string } }
        - { name: subjectId, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string }, description: 名称模糊搜索 }
        - { name: cursor, in: query, schema: { type: string }, description: 上一页返回的游标 }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  knowledgePoints:
                    type: array
                    items: { $ref: '#/components/schemas/KnowledgePointItem' }
                  nextCursor: { type: string }
  /knowledge-points/{id}:
    get:
      tags: [learning]
      summary: 知识点详情（正文仅已发布可见）与个人统计
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/KnowledgePointDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /wrong-items:
    get:
      tags: [learning]
      summary: 错题本（每题取最近一次错误作答）
      parameters:
        - { name: knowledgePointId, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string }, description: 上一页返回的游标 }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  wrongItems:
                    type: array
                    items: { $ref: '#/components/schemas/WrongItem' }
                  nextCursor: { type: string }
  /wrong-items/{id}:
    delete:
      tags: [learning]
      summary: 从错题本移除单题（软删除）
      description: 仅从当前账号的错题本和错题重练入口隐藏；原始作答与成绩保留。
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: 已移除 }
        '404': { $ref: '#/components/responses/NotFound' }
  /issue-reports:
    post:
      tags: [learning]
      summary: 提交题目问题反馈（后端补全题目版本与判分上下文）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [practiceItemId, targetType]
              properties:
                practiceItemId: { type: string }
                targetType: { type: string, enum: [stem, answer, explanation, classification, ai_grading] }
                description: { type: string }
      responses:
        '201': { description: 已提交 }
        '404': { $ref: '#/components/responses/NotFound' }
  /practice/availability:
    get:
      tags: [practice]
      summary: 当前筛选下可用题量
      parameters:
        - { name: levelId, in: query, required: true, schema: { type: string } }
        - { name: subjectId, in: query, schema: { type: string } }
        - { name: sourceId, in: query, schema: { type: string }, description: 指定题目数据来源 }
        - { name: sourceSectionId, in: query, schema: { type: string }, description: 指定来源章节 }
        - { name: mode, in: query, schema: { type: string, enum: [comprehensive, knowledge, wrong_items] } }
        - { name: selectionOrder, in: query, schema: { type: string, enum: [source_order, random], default: source_order } }
        - { name: knowledgePointIds, in: query, schema: { type: string }, description: 逗号分隔 }
        - { name: count, in: query, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { available: { type: integer } }
  /practice/sources:
    get:
      tags: [practice]
      summary: 当前级别可用的题目数据来源
      parameters:
        - { name: levelId, in: query, required: true, schema: { type: string } }
        - { name: subjectId, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sources:
                    type: array
                    items: { $ref: '#/components/schemas/PracticeSource' }
  /practice-sessions:
    post:
      tags: [practice]
      summary: 创建不可变练习批次（仅已发布题目；不足返回 409）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePracticeRequest' }
      responses:
        '201': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PreSubmitSession' } } } }
        '409':
          description: |
            insufficient_questions：可用题量不足（details.available 为实际数量，服务端不放宽条件）；
            no_wrong_items：没有可重练的错题。
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    get:
      tags: [practice]
      summary: 练习历史
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [generating, active, grading, completed, analysis_failed, generation_failed] } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/SessionListItem' }
                  nextCursor: { type: string }
  /ai-practice-sessions:
    post:
      tags: [practice]
      summary: 根据账号记忆或 JLPT 级别异步生成私有练习
      description: AI 只从已审核知识点生成新题；题目不会自动进入普通题库，生成完成后通过普通练习接口答题。
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AIGeneratePracticeRequest' }
      responses:
        '202':
          description: 已加入生成队列
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string, enum: [generating] }
        '409': { description: no_knowledge_points }
        '503': { description: ai_unavailable }
  /practice-sessions/{id}:
    get:
      tags: [practice]
      summary: 获取批次与答题前题目（契约保证无答案字段）
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PreSubmitSession' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [practice]
      summary: 软删除练习历史
      description: 仅从当前账号的历史、仪表盘和错题本视图隐藏；原始作答、成绩和题目版本保留。
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: 已隐藏 }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: practice_in_progress（正在生成的练习） }
  /practice-sessions/{id}/answers/{itemId}:
    put:
      tags: [practice]
      summary: 自动保存单题答案（仅 active 批次；返回服务端 savedAt）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: itemId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value: { $ref: '#/components/schemas/AnswerValue' }
                markedForReview: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { savedAt: { type: string } }
        '409': { description: practice_not_active（已提交后保存被拒绝） }
  /practice-sessions/{id}/submit:
    post:
      tags: [practice]
      summary: |
        提交本批练习并开始判分。必须携带全部最终答案与 Idempotency-Key 请求头；
        相同键+相同内容重复提交返回现有结果；相同键不同内容返回 409 idempotency_conflict。
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  items:
                    type: object
                    properties:
                      itemId: { type: string }
                      value: { $ref: '#/components/schemas/AnswerValue' }
                      markedForReview: { type: boolean }
      responses:
        '200': { description: OK（返回分层结果）, content: { application/json: { schema: { $ref: '#/components/schemas/ResultSession' } } } }
        '400': { description: missing_idempotency_key }
        '409': { description: practice_not_active / idempotency_conflict }
  /practice-sessions/{id}/result:
    get:
      tags: [practice]
      summary: 分层结果（已确认正确率与 AI 判定严格分开；grading 状态可轮询）
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ResultSession' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: practice_not_submitted }
  /practice-sessions/{id}/analysis/retry:
    post:
      tags: [practice]
      summary: 重试失败的本批 AI 分析（只入队一个整批任务）
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ResultSession' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: practice_not_submitted / analysis_not_failed }
  /admin/overview:
    get:
      tags: [admin]
      summary: 内容概览统计
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  draft: { type: integer }
                  inReview: { type: integer }
                  published: { type: integer }
                  retired: { type: integer }
                  publishedNoKnowledge: { type: integer }
                  publishedNoSource: { type: integer }
                  publishedNoAnswer: { type: integer }
                  openIssues: { type: integer }
  /admin/questions:
    get:
      tags: [admin]
      summary: 题目列表（含答案覆盖筛选；游标分页）
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, in_review, published, retired] } }
        - { name: levelId, in: query, schema: { type: string } }
        - { name: subjectId, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: hasAnswer, in: query, schema: { type: string, enum: [yes, no] } }
        - { name: quality, in: query, schema: { type: string, enum: [no_knowledge, no_source, no_answer] } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  questions:
                    type: array
                    items: { $ref: '#/components/schemas/QuestionAdmin' }
                  nextCursor: { type: string }
    post:
      tags: [admin]
      summary: 新建题目（第一版；可携带材料与标准答案）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestionInput' }
      responses:
        '201': { description: OK, content: { application/json: { schema: { type: object, properties: { question: { $ref: '#/components/schemas/QuestionAdmin' } } } } } }
  /admin/questions/{id}:
    get:
      tags: [admin]
      summary: 题目详情（管理端可读标准答案）
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { question: { $ref: '#/components/schemas/QuestionAdmin' } } } } } }
    patch:
      tags: [admin]
      summary: 编辑题目（总是创建新版本；已发布版本继续对外服务）
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestionInput' }
      responses:
        '200': { description: OK }
        '409': { description: question_retired }
  /admin/questions/{id}/submit-review:
    post:
      tags: [admin]
      summary: 草稿提交审核
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /admin/questions/{id}/publish:
    post:
      tags: [admin]
      summary: 发布当前版本（事务内校验；写入审计）
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
        '409': { description: question_invalid / already_published / question_retired }
  /admin/questions/{id}/retire:
    post:
      tags: [admin]
      summary: 下架题目（历史记录保留题目快照）
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /admin/knowledge-points:
    get:
      tags: [admin]
      summary: 知识点管理列表
      parameters:
        - { name: levelId, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string }, description: 上一页返回的游标 }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  knowledgePoints: { type: array, items: { $ref: '#/components/schemas/AdminKnowledgePoint' } }
                  nextCursor: { type: string }
    post:
      tags: [admin]
      summary: 新建知识点（默认草稿）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, levelId, subjectId]
              properties:
                name: { type: string }
                levelId: { type: string }
                subjectId: { type: string }
                parentId: { type: string, nullable: true }
                description: { type: string }
                commonMistakes: { type: string }
                examples: { type: string }
      responses: { '201': { description: OK } }
  /admin/knowledge-points/{id}:
    patch:
      tags: [admin]
      summary: 更新知识点（name/description/commonMistakes/examples/status/parentId）
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /admin/sources:
    get:
      tags: [admin]
      summary: 来源与章节列表
      parameters:
        - { name: cursor, in: query, schema: { type: string }, description: 上一页返回的游标 }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sources: { type: array, items: { $ref: '#/components/schemas/Source' } }
                  nextCursor: { type: string }
    post:
      tags: [admin]
      summary: 新建来源（必须记录授权说明）
      responses: { '201': { description: OK } }
  /admin/sources/{id}:
    patch:
      tags: [admin]
      summary: 更新来源
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /admin/sources/{id}/sections:
    post:
      tags: [admin]
      summary: 新增章节
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '201': { description: OK } }
  /admin/issue-reports:
    get:
      tags: [admin]
      summary: 举报列表
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, resolved, dismissed] } }
        - { name: cursor, in: query, schema: { type: string }, description: 上一页返回的游标 }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  issueReports: { type: array, items: { $ref: '#/components/schemas/IssueReport' } }
                  nextCursor: { type: string }
  /admin/issue-reports/{id}:
    patch:
      tags: [admin]
      summary: 处理举报（resolved / dismissed + 备注）
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
        '409': { description: issue_already_handled }
  /admin/import-jobs:
    post:
      tags: [admin]
      summary: 上传结构化 JSON 并创建导入任务
      description: >-
        仅接受本地 OCR 服务导出的结构化 JSON（{"items": [...]}，分类用 levelCode/subjectCode/
        knowledgePointNames 码值与名称表示，服务端解析为内部 ID）。同步校验后直接生成待审核草稿，
        任务立即进入 review_ready；不做文件格式识别，也不调用 AI，因此没有异步阶段和失败重试。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 结构化 JSON 文件，默认最大 10 MB
      responses:
        '201': { description: 已创建, content: { application/json: { schema: { type: object, properties: { job: { $ref: '#/components/schemas/ImportJob' } } } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '413': { description: file_too_large }
    get:
      tags: [admin]
      summary: 导入任务列表
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: cursor, in: query, schema: { type: string }, description: 上一页返回的游标 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs: { type: array, items: { $ref: '#/components/schemas/ImportJob' } }
                  nextCursor: { type: string }
  /admin/import-jobs/{id}:
    get:
      tags: [admin]
      summary: 导入任务进度、提取原文和结构化草稿
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string }, description: 上一页返回的导入项位置游标 }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  job: { $ref: '#/components/schemas/ImportJob' }
                  items: { type: array, items: { $ref: '#/components/schemas/ImportItem' } }
                  nextCursor: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/import-items/{id}:
    get:
      tags: [admin]
      summary: 查看单个导入项的原文对照和结构化草稿
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { item: { $ref: '#/components/schemas/ImportItem' } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [admin]
      summary: 保存导入项草稿（保存后回到待审核）
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [draft]
              properties: { draft: { $ref: '#/components/schemas/ImportDraft' } }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/ValidationError' }
  /admin/import-items/{id}/approve:
    post:
      tags: [admin]
      summary: 确认审核导入项
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '400': { $ref: '#/components/responses/ValidationError' } }
  /admin/import-items/{id}/publish:
    post:
      tags: [admin]
      summary: 发布已审核导入项到公共题库
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK }
        '409': { description: import_item_not_approved / question_invalid }

components:
  responses:
    MeResponse:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MeResponse' }
    Unauthorized:
      description: unauthorized
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFound:
      description: not_found（不泄露资源是否存在）
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    ValidationError:
      description: validation_failed（details.fields 为字段级错误）
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    RateLimited:
      description: rate_limited
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            details: { type: object, nullable: true }
    MeResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            id: { type: string }
            email: { type: string }
            role: { type: string, enum: [learner, admin] }
            defaultLevelId: { type: string, nullable: true }
    Exam:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        levels:
          type: array
          items:
            type: object
            properties: { id: { type: string }, code: { type: string }, name: { type: string } }
        subjects:
          type: array
          items:
            type: object
            properties: { id: { type: string }, code: { type: string }, name: { type: string } }
    AnswerValue:
      oneOf:
        - type: object
          properties: { optionIds: { type: array, items: { type: string } } }
        - type: object
          properties: { text: { type: string } }
      nullable: true
    PreSubmitSession:
      type: object
      description: 答题前 DTO；契约保证不含 correctAnswer/answerAuthority/gradingStatus/explanation 等字段
      properties:
        id: { type: string }
        status: { type: string, enum: [generating, active, grading, completed, analysis_failed, generation_failed] }
        answeredCount: { type: integer }
        totalCount: { type: integer }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              position: { type: integer }
              type: { type: string, enum: [single_choice, multiple_choice, fill_blank, short_answer] }
              material:
                nullable: true
                type: object
                properties: { id: { type: string }, title: { type: string }, content: { type: string } }
              stem: { type: string }
              sourceSectionName: { type: string }
              options:
                nullable: true
                type: array
                items:
                  type: object
                  properties: { id: { type: string }, label: { type: string }, text: { type: string } }
              savedAnswer: { $ref: '#/components/schemas/AnswerValue' }
              markedForReview: { type: boolean }
              savedAt: { type: string, nullable: true }
    ResultSession:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [grading, completed, analysis_failed] }
        createdAt: { type: string }
        submittedAt: { type: string, nullable: true }
        summary:
          type: object
          properties:
            confirmed:
              type: object
              description: 仅 official / human_verified 答案形成的正式正确率
              properties:
                correct: { type: integer }
                total: { type: integer }
                accuracy: { type: number, nullable: true }
            ai:
              type: object
              description: AI 判定单独计数，不混入正式正确率
              properties:
                correct: { type: integer }
                completed: { type: integer }
                pending: { type: integer }
                failed: { type: integer }
        aiAnalysis:
          type: object
          properties:
            status: { type: string, enum: [not_requested, pending, completed, failed] }
            text: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              position: { type: integer }
              type: { type: string }
              material: { type: object, nullable: true }
              stem: { type: string }
              sourceSectionName: { type: string }
              options: { type: array, items: { type: object } }
              knowledgePoints:
                type: array
                items:
                  type: object
                  properties: { id: { type: string }, name: { type: string } }
              userAnswer: { $ref: '#/components/schemas/AnswerValue' }
              gradingStatus: { type: string, enum: [correct, incorrect, unanswered, pending, failed] }
              gradingSource: { type: string, enum: [deterministic, ai], nullable: true }
              answerAuthority: { type: string, enum: [official, human_verified], nullable: true }
              correctAnswer: { $ref: '#/components/schemas/AnswerValue' }
              explanation:
                nullable: true
                type: object
                properties:
                  text: { type: string }
                  source: { type: string, enum: [official, human_verified, ai] }
    SessionListItem:
      type: object
      properties:
        id: { type: string }
        status: { type: string }
        totalCount: { type: integer }
        createdAt: { type: string }
        submittedAt: { type: string, nullable: true }
    CreatePracticeRequest:
      type: object
      required: [levelId, count]
      properties:
        levelId: { type: string }
        subjectId: { type: string }
        mode: { type: string, enum: [comprehensive, knowledge, wrong_items], default: comprehensive }
        selectionOrder: { type: string, enum: [source_order, random], default: source_order }
        sourceId: { type: string, description: 指定题目数据来源；不传表示全部题目 }
        sourceSectionId: { type: string, description: 指定来源章节 }
        knowledgePointIds: { type: array, items: { type: string } }
        count: { type: integer, enum: [10, 20, 30] }
    AIGeneratePracticeRequest:
      type: object
      properties:
        levelId: { type: string, description: 省略时使用账号默认级别 }
        subjectId: { type: string, description: 可选科目范围；省略表示混合科目 }
        knowledgePointIds: { type: array, maxItems: 10, items: { type: string }, description: memory 模式可指定知识点；省略或 level 模式时由服务端按当前级别选择 }
        count: { type: integer, enum: [10, 20, 30], default: 20 }
        difficulty: { type: string, enum: [easy, normal, hard, mixed], default: mixed, description: 简单为 1–2，一般为 3，困难为 4–5，混合为随机 1–5 }
        generationMode: { type: string, enum: [memory, level], default: memory, description: memory 根据账号记忆，level 根据当前级别 }
        questionType: { type: string, enum: [mixed, single_choice, multiple_choice, fill_blank, short_answer], default: mixed, description: mixed 为混合题型，也可指定单独题型 }
        showFurigana: { type: boolean, default: false, description: 是否在汉字旁用括号标注假名，如 日本語（にほんご） }
    PracticeSource:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        questionCount: { type: integer }
        sections:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              questionCount: { type: integer }
    KnowledgePointItem:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        levelId: { type: string }
        levelCode: { type: string }
        subjectId: { type: string }
        subjectName: { type: string }
        parentId: { type: string, nullable: true }
        questionCount: { type: integer }
        stats:
          nullable: true
          type: object
          properties:
            confirmedAnswered: { type: integer }
            confirmedCorrect: { type: integer }
            recentAnswered: { type: integer }
            recentCorrect: { type: integer }
            aiAnswered: { type: integer }
            aiCorrect: { type: integer }
            consecutiveWrong: { type: integer }
            lastPracticedAt: { type: string, nullable: true }
    KnowledgePointDetail:
      allOf:
        - $ref: '#/components/schemas/KnowledgePointItem'
        - type: object
          properties:
            description: { type: string }
            commonMistakes: { type: string }
            examples: { type: string }
            status: { type: string }
    AdminKnowledgePoint:
      type: object
      properties:
        id: { type: string }
        examId: { type: string }
        levelId: { type: string }
        subjectId: { type: string }
        parentId: { type: string, nullable: true }
        name: { type: string }
        description: { type: string }
        commonMistakes: { type: string }
        examples: { type: string }
        status: { type: string, enum: [draft, published, retired] }
        questionCount: { type: integer }
    Source:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [book, past_exam, self_made, ai_generated] }
        author: { type: string }
        publisher: { type: string }
        year: { type: integer, nullable: true }
        licenseNote: { type: string }
        internalNote: { type: string }
        sections:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              sourceId: { type: string }
              name: { type: string }
    IssueReport:
      type: object
      properties:
        id: { type: string }
        targetType: { type: string }
        description: { type: string }
        status: { type: string, enum: [open, resolved, dismissed] }
        resolutionNote: { type: string }
        createdAt: { type: string }
        userEmail: { type: string }
        stem: { type: string }
        questionId: { type: string }
    WrongItem:
      type: object
      properties:
        itemId: { type: string }
        sessionId: { type: string }
        questionId: { type: string }
        position: { type: integer }
        type: { type: string }
        stem: { type: string }
        options: { type: array, items: { type: object }, nullable: true }
        material: { type: object, nullable: true }
        knowledgePoints: { type: array, items: { type: object } }
        gradingStatus: { type: string }
        answerAuthority: { type: string, nullable: true }
        userAnswer: { $ref: '#/components/schemas/AnswerValue' }
        correctAnswer: { $ref: '#/components/schemas/AnswerValue' }
        explanation: { type: object, nullable: true }
    Dashboard:
      type: object
      properties:
        activeSession:
          nullable: true
          type: object
          properties: { id: { type: string }, status: { type: string, enum: [generating, active] }, answeredCount: { type: integer }, totalCount: { type: integer } }
        recentSessions:
          type: array
          items: { $ref: '#/components/schemas/SessionListItem' }
        recommendations:
          type: array
          items:
            type: object
            properties:
              type: { type: string, enum: [knowledge, comprehensive] }
              knowledgePointId: { type: string, nullable: true }
              name: { type: string }
              recentAnswered: { type: integer }
              recentWrongCount: { type: integer }
              accuracy: { type: number, nullable: true }
              consecutiveWrong: { type: integer }
              suggestedCount: { type: integer }
              reason: { type: string, description: 由后端真实统计数字组织 }
              knowledgePointIds: { type: array, items: { type: string } }
        comprehensive: { type: object, nullable: true }
        statsEmpty: { type: boolean }
        memory: { $ref: '#/components/schemas/LearningMemory' }
    LearningMemory:
      type: object
      required: [confirmedAnswered, confirmedCorrect, aiAnswered, aiCorrect, advice]
      properties:
        confirmedAnswered: { type: integer }
        confirmedCorrect: { type: integer }
        aiAnswered: { type: integer, description: AI 判定数量，不计入正式正确率 }
        aiCorrect: { type: integer, description: AI 判定正确数量，不计入正式正确率 }
        statsUpdatedAt: { type: string, nullable: true }
        advice:
          type: object
          required: [status, text]
          properties:
            status: { type: string, enum: [not_requested, pending, completed, failed] }
            text: { type: string }
            updatedAt: { type: string, nullable: true }
    QuestionInput:
      type: object
      required: [type, stem, levelId, subjectId]
      properties:
        type: { type: string, enum: [single_choice, multiple_choice, fill_blank, short_answer] }
        stem: { type: string }
        options:
          type: array
          items:
            type: object
            properties: { id: { type: string }, label: { type: string }, text: { type: string } }
        materialId: { type: string, nullable: true }
        materialTitle: { type: string }
        materialContent: { type: string }
        levelId: { type: string }
        subjectId: { type: string }
        sourceSectionId: { type: string, nullable: true }
        difficulty: { type: integer, minimum: 1, maximum: 5 }
        knowledgePointIds: { type: array, items: { type: string } }
        answer:
          nullable: true
          type: object
          description: 省略表示无标准答案（练习时走 AI 判定）
          properties:
            value: { type: object }
            authority: { type: string, enum: [official, human_verified] }
            explanation: { type: string }
    QuestionAdmin:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [draft, in_review, published, retired] }
        hasAnswer: { type: boolean }
        publishedVersionId: { type: string, nullable: true }
        currentVersion: { type: object, nullable: true }
        updatedAt: { type: string }
    ImportJob:
      type: object
      properties:
        id: { type: string }
        fileName: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        status: { type: string, enum: [uploaded, extracting, structuring, review_ready, published, failed] }
        stageError: { type: string }
        extractedText: { type: string }
        itemCount: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
    ImportAnswer:
      type: object
      properties:
        value: { type: object }
        authority: { type: string, enum: [official, human_verified] }
        explanation: { type: string }
    ImportSuggestion:
      type: object
      properties:
        value: { type: object }
        explanation: { type: string }
    ImportDraft:
      type: object
      required: [type, stem, options, levelId, subjectId, difficulty, knowledgePointIds]
      properties:
        materialKey: { type: string }
        type: { type: string, enum: [single_choice, multiple_choice, fill_blank, short_answer] }
        stem: { type: string }
        options: { type: array, items: { type: object, properties: { id: { type: string }, label: { type: string }, text: { type: string } } } }
        materialTitle: { type: string }
        materialContent: { type: string }
        levelId: { type: string }
        subjectId: { type: string }
        sourceSectionId: { type: string, nullable: true }
        difficulty: { type: integer, minimum: 1, maximum: 5 }
        knowledgePointIds: { type: array, items: { type: string } }
        answer: { allOf: [{ $ref: '#/components/schemas/ImportAnswer' }], nullable: true }
        sourceAnswer: { allOf: [{ $ref: '#/components/schemas/ImportAnswer' }], nullable: true }
        aiSuggestedAnswer: { allOf: [{ $ref: '#/components/schemas/ImportSuggestion' }], nullable: true }
    ImportItem:
      type: object
      properties:
        id: { type: string }
        jobId: { type: string }
        position: { type: integer }
        rawExcerpt: { type: string }
        draft: { allOf: [{ $ref: '#/components/schemas/ImportDraft' }], nullable: true }
        anomalies: { type: array, items: { type: string } }
        reviewStatus: { type: string, enum: [pending, approved, published, rejected] }
        publishedQuestionId: { type: string, nullable: true }
        jobStatus: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
